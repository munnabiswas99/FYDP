<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coconut Disease Detection - Result</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f7f9;
      color: #333;
      padding-bottom: 80px;
    }

    /* Navbar */
    header {
      background: #2e7d32;
      padding: 15px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .navbar {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }

    .navbar h2 {
      font-size: 1.4rem;
      font-weight: 500;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 1rem;
      transition: opacity 0.2s;
    }

    .nav-links a:hover {
      opacity: 0.7;
    }

    /* Page container */
    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 15px;
      text-align: center;
    }

    h1 {
      color: #2e7d32;
      margin-bottom: 8px;
    }

    h2 {
      color: white;
      margin-bottom: 25px;
      font-size: 1.2rem;
    }

    /* Image Cards */
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      width: 300px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.07);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h3 {
      color: #2e7d32;
      margin-bottom: 10px;
    }

    .card img {
      width: 100%;
      border-radius: 8px;
    }

    /* Button */
    .btn {
      text-decoration: none;
      color: white;
      background-color: #2e7d32;
      padding: 12px 20px;
      border-radius: 8px;
      transition: background 0.2s, transform 0.1s;
      display: inline-block;
      margin-top: 30px;
    }

    .btn:hover {
      background: #1b5e20;
      transform: translateY(-2px);
    }

    /* Footer */
    footer {
      background: #2e7d32;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 0.9rem;
      position: fixed;
      bottom: 0;
      width: 100%;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>

  <!-- Header + Navbar -->
  <header>
    <div class="navbar">
      <h2>Coconut Disease Detection</h2>

      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/">Upload</a>
        <a href="https://github.com" target="_blank">GitHub</a>
      </div>
    </div>
  </header>

  <!-- Content -->
  <div class="container">
    <h1>Prediction Result</h1>
    <h2 style="color: red;">Predicted: {{ predicted }}</h2>

    <div class="row">
      <div class="card">
        <h3>Original Image</h3>
        <img src="{{ original_image }}" alt="original">
      </div>

      <div class="card">
        <h3>Grad-CAM Heatmap</h3>
        <img src="{{ heatmap_image }}" alt="heatmap">
      </div>

      <div class="card">
        <h3>Grad-CAM Overlay</h3>
        <img src="{{ cam_image }}" alt="cam">
      </div>
    </div>

    <a class="btn" style="font-weight: bold;" href="/">Try Another Image</a>
  </div>

  <!-- Footer -->
  <footer>
    © 2025 Coconut Disease Detection | FYDP Project
  </footer>

</body>
</html>

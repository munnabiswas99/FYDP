<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Result - Coconut Disease Detection</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      color: #2e7d32;
      margin-bottom: 10px;
      font-size: 1.8rem;
    }

    h2 {
      color: #555;
      margin-bottom: 25px;
      font-size: 1.2rem;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
    }

    .card {
      background: #fff;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      text-align: center;
      flex: 1 1 280px;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h3 {
      margin-bottom: 10px;
      color: #2e7d32;
      font-size: 1.1rem;
    }

    .card img {
      max-width: 100%;
      border-radius: 8px;
    }

    a {
      display: inline-block;
      margin-top: 25px;
      text-decoration: none;
      color: white;
      background-color: #2e7d32;
      padding: 10px 18px;
      border-radius: 8px;
      transition: background-color 0.2s, transform 0.1s;
    }

    a:hover {
      background-color: #1b5e20;
      transform: translateY(-2px);
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      h1 { font-size: 1.5rem; }
      h2 { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <h1>Prediction Result</h1>
  <h2>Predicted: {{ predicted }}</h2>

  <div class="row">
    <div class="card">
      <h3>Original</h3>
      <img src="{{ original_image }}" alt="original">
    </div>

    <div class="card">
      <h3>Grad-CAM Heatmap</h3>
      <img src="{{ heatmap_image }}" alt="heatmap">
    </div>

    <div class="card">
      <h3>Overlay</h3>
      <img src="{{ cam_image }}" alt="cam">
    </div>
  </div>

  <a href="/">Try another image</a>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coconut Disease Detection</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 0;
    }

    /* Header */
    header {
      background-color: #2e7d32;
      color: white;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 500;
    }

    /* Navbar */
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 1rem;
      transition: opacity 0.2s;
    }

    nav a:hover {
      opacity: 0.8;
    }

    /* Main container */
    .main-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 160px);
      padding: 20px;
    }

    .container {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
      padding: 30px 25px;
      text-align: center;
      transition: transform 0.2s;
    }

    .container:hover {
      transform: translateY(-5px);
    }

    .container h2 {
      color: #2e7d32;
      margin-bottom: 15px;
      font-size: 1.8rem;
    }

    .container p {
      color: #555;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input[type="file"] {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    input[type="file"]:hover {
      border-color: #2e7d32;
    }

    button {
      background-color: #2e7d32;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: #1b5e20;
      transform: translateY(-2px);
    }

    /* Footer */
    footer {
      background: #2e7d32;
      color: white;
      text-align: center;
      padding: 12px 10px;
      margin-top: 40px;
    }

    footer p {
      font-size: 0.9rem;
    }

    /* Responsive */
    @media (max-width: 600px) {
      header {
        justify-content: center;
        text-align: center;
      }

      nav {
        width: 100%;
        text-align: center;
        margin-top: 10px;
      }

      nav a {
        margin: 0 10px;
      }

      .container h2 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Header + Navbar -->
  <header>
    <h1>Coconut Disease Detection</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/documentation">Docs</a>
    </nav>
  </header>

  <!-- Main Upload Section -->
  <div class="main-container">
    <div class="container">
      <h2>Upload Image</h2>
      <p>Upload a coconut leaf or trunk image to detect the disease and visualize Grad-CAM results.</p>

      <form action="/predict" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/*" required />
        <button type="submit" style="font-weight:bold;">Predict</button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>© 2025 Coconut Disease Detection | FYDP Project </p>
  </footer>

</body>
</html>

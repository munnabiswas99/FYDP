<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coconut Disease Detection</title>
  <style>
    /* Reset some defaults */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
      padding: 30px 25px;
      text-align: center;
      transition: transform 0.2s;
    }

    .container:hover {
      transform: translateY(-5px);
    }

    h1 {
      color: #2e7d32;
      margin-bottom: 15px;
      font-size: 1.8rem;
    }

    p {
      color: #555;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input[type="file"] {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    input[type="file"]:hover {
      border-color: #2e7d32;
    }

    button {
      background-color: #2e7d32;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: #1b5e20;
      transform: translateY(-2px);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container {
        padding: 25px 15px;
      }

      h1 {
        font-size: 1.5rem;
      }

      p {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Coconut Disease Detection</h1>
    <p>Upload an image of the coconut leaf or trunk to predict the disease and visualize Grad-CAM results.</p>

    <form action="/predict" method="post" enctype="multipart/form-data">
      <input type="file" name="file" accept="image/*" required />
      <button type="submit">Predict</button>
    </form>
  </div>
</body>
</html>
